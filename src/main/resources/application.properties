spring.application.name=collectionmanager

# ============================================
# Banco de dados MySQL (credenciais no .env)
# ============================================
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================
# JWT (segredo no .env - minimo 32 caracteres)
# ============================================
jwt.secret=${JWT_SECRET}
jwt.access-ttl-ms=3600000
jwt.refresh-ttl-ms=108000000

# ============================================
# Swagger / OpenAPI 3 (springdoc)
# UI:  /swagger-ui.html  |  JSON: /v3/api-docs  |  YAML: /v3/api-docs.yaml
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.operations-sorting=alpha
